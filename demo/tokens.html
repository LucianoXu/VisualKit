<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisualKit tokens</title>
  <link rel="icon" href="data:,">
  <script>
    // ?theme=dark shows the dark theme; else the reader's choice from the demo
    try {
      var q = new URLSearchParams(location.search).get("theme");
      var t = q || localStorage.getItem("visualkit-demo:theme");
      document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="stylesheet" href="./visualkit.css">
  <style>
    /* the specimen's own layout: a column of labelled rows */
    body { padding: 28px 32px 36px; }
    .sheet { max-width: 640px; display: flex; flex-direction: column; gap: 18px; }
    .head { display: flex; align-items: baseline; gap: 12px; }
    .head .vk-logo { font-size: 26px; }
    .row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; }
    .row > .vk-overline { margin: 0; }
    .sw { display: flex; flex-wrap: wrap; gap: 6px; }
    .sw i { width: 30px; height: 30px; border-radius: 9px; background: var(--c); box-shadow: inset 0 0 0 1px var(--line); }
    .grad { height: 30px; border-radius: 9px; background: var(--grad); }
    .texts { display: flex; gap: 16px; font-size: 14px; }
    .line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .panel { padding: 14px 16px; border-radius: var(--r-2xl); }
    .sparks { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .vk-player.specimen { position: static; max-width: none; margin: 0; transition: none; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="head"><span class="vk-logo">VisualKit</span><span class="vk-soft">Quiet surfaces, one gradient for what matters.</span></div>
    <div class="row"><span class="vk-overline">Gradient</span><div class="grad"></div></div>
    <div class="row"><span class="vk-overline">Ground</span>
      <div class="sw"><i style="--c: var(--canvas)"></i><i style="--c: var(--surface-solid)"></i><i style="--c: var(--code-bg)"></i><i style="--c: var(--line)"></i><i style="--c: var(--accent)"></i></div></div>
    <div class="row"><span class="vk-overline">Text</span>
      <div class="texts"><span>Primary</span><span class="vk-soft">Secondary</span><span class="vk-muted">Tertiary</span><a href="#">Accent link</a><code>mono</code></div></div>
    <div class="row"><span class="vk-overline">Meaning</span>
      <div class="sw"><i style="--c: var(--ok)"></i><i style="--c: var(--info)"></i><i style="--c: var(--warn)"></i><i style="--c: var(--bad)"></i><i style="--c: var(--star)"></i></div></div>
    <div class="row"><span class="vk-overline">Kinds</span>
      <div class="sw"><i style="--c: var(--cat-1)"></i><i style="--c: var(--cat-2)"></i><i style="--c: var(--cat-3)"></i><i style="--c: var(--cat-4)"></i><i style="--c: var(--cat-5)"></i><i style="--c: var(--cat-6)"></i><i style="--c: var(--cat-7)"></i><i style="--c: var(--cat-8)"></i><i style="--c: var(--cat-9)"></i></div></div>
    <div class="row"><span class="vk-overline">Buttons</span>
      <div class="line"><button class="vk-btn">Cancel</button><button class="vk-btn primary">Create</button><button class="vk-btn ok">Approve</button><button class="vk-btn info">Comment</button><button class="vk-btn soft">Fold all</button><button class="vk-btn bad">Revoke</button></div></div>
    <div class="row"><span class="vk-overline">Controls</span>
      <div class="line"><div class="vk-seg"><button class="on">Selection</button><button>Uses</button><button>Used by</button></div>
        <button class="vk-switch" role="switch" aria-checked="true"><i></i>On</button>
        <span class="vk-pill"><span class="vk-dot ok"></span>Built</span><span class="vk-chip accent">new</span><span class="vk-badge">3</span></div></div>
    <div class="row"><span class="vk-overline">Sparklines</span>
      <!-- sparkline() output (ts/spark.ts); the second in --c -->
      <div class="sparks"><div><svg class="vk-spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path class="a" d="M0.00 19.63L9.09 16.17L18.18 17.90L27.27 12.72L36.36 9.26L45.45 12.02L54.55 4.07L63.64 6.49L72.73 2.00L81.82 5.80L90.91 8.57L100.00 10.99L100.00 30.00L0.00 30.00Z"/><path class="t" d="M0.00 3.73H100.00"/><path class="l" d="M0.00 19.63L9.09 16.17L18.18 17.90L27.27 12.72L36.36 9.26L45.45 12.02L54.55 4.07L63.64 6.49L72.73 2.00L81.82 5.80L90.91 8.57L100.00 10.99"/><path class="p" d="M100.00 10.99h0"/></svg></div><div style="--c: var(--info)"><svg class="vk-spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path class="a" d="M0.00 2.00L9.09 6.67L18.18 4.33L27.27 9.00L36.36 7.83L45.45 13.67L54.55 16.00L63.64 15.07L72.73 18.33L81.82 20.20L90.91 19.27L100.00 22.77L100.00 30.00L0.00 30.00Z"/><path class="l" d="M0.00 2.00L9.09 6.67L18.18 4.33L27.27 9.00L36.36 7.83L45.45 13.67L54.55 16.00L63.64 15.07L72.73 18.33L81.82 20.20L90.91 19.27L100.00 22.77"/><path class="p" d="M100.00 22.77h0"/></svg></div></div></div>
    <div class="row"><span class="vk-overline">Player</span>
      <!-- Player (ts/player.ts) makes this; here in the flow rather than fixed at the foot -->
      <div class="vk-player vk-glass specimen"><button type="button" class="vk-act icon vk-player-play playing" aria-label="Pause"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3.4v9.2L12.4 8z"/></svg><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg></button><span class="vk-player-time"><b>1:34</b><span class="vk-player-total"> / 3:00</span></span><input class="vk-player-track" type="range" min="0" max="180" step="any" value="94" aria-label="Playhead"><div class="vk-seg mini vk-player-speed"><button class="on">1×</button><button>2×</button></div><button class="vk-icon" aria-pressed="true" aria-label="Filter"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 3.5h11l-4.2 5v4l-2.6 1.2V8.5z"/></svg></button></div></div>
    <div class="row"><span class="vk-overline">Surfaces</span>
      <div class="panel vk-glass">
        <div class="vk-drawer-kicker"><span class="vk-dot" style="background: var(--cat-6)"></span>theorem · Algebra</div>
        <div class="vk-title" style="margin-top:4px">Lagrange</div>
        <div class="vk-stats" style="margin-bottom:8px"><div class="vk-stat"><div class="vk-stat-n">12</div><div class="vk-stat-l">it uses</div></div><div class="vk-stat" style="--g: var(--grad-cool)"><div class="vk-stat-n">5</div><div class="vk-stat-l">use it</div></div><div class="vk-stat" style="--g: var(--grad-warm)"><div class="vk-stat-n">3</div><div class="vk-stat-l">open</div></div></div>
        <div class="vk-banner info">Two opinions since the last build.</div>
      </div></div>
  </div>
</body>
</html>
